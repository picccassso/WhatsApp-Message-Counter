<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message counter for WhatsApp exports</title>
  <meta name="description" content="Drop a WhatsApp chat export (.txt) and count its messages — right in your browser.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="top">
      <span class="presence" aria-hidden="true"></span>
      <span class="wordmark">message counter</span>
    </header>

    <section id="dropSection" class="drop-section">
      <button type="button" id="dropZone" class="drop-zone" aria-describedby="dropHint">
        <span class="drop-title">Drop your WhatsApp export here</span>
        <span class="drop-sub">The .txt you get from Export chat — or browse your files</span>
      </button>
      <p id="dropHint" class="drop-hint">In WhatsApp: open the chat, tap ⋮, then More, then Export chat, then Without media.</p>
      <button type="button" id="sampleBtn" class="text-btn">No export handy? Count a sample chat</button>
      <input type="file" id="fileInput" accept=".txt,text/plain" hidden>
    </section>

    <section id="errorSection" class="error-section" hidden>
      <div class="bubble bubble-in">
        <p id="errorText" class="error-text"></p>
        <button type="button" id="errorSampleBtn" class="text-btn">Count the sample chat instead</button>
      </div>
    </section>

    <section id="resultSection" class="result-section" hidden aria-live="polite">
      <p class="file-name" id="fileName"></p>
      <p class="file-sub" id="fileSub"></p>

      <div class="bubble bubble-out answer">
        <span class="answer-num" id="bigNumber">0</span>
        <span class="answer-label">messages
          <svg class="receipts" viewBox="0 0 20 12" width="18" height="11" aria-hidden="true">
            <path d="M1 6.5 4.2 9.7 10 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8.5 6.5 11.7 9.7 17.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </div>

      <canvas id="strip" class="strip" role="img" aria-label="One tick per message, colored by sender"></canvas>
      <p class="strip-caption">one tick per message, colored by sender — hover a name to spotlight them</p>

      <ul id="senders" class="senders"></ul>
      <p id="extras" class="extras"></p>

      <button type="button" id="againBtn" class="again-btn">Count another file</button>
    </section>

    <footer class="foot">Everything runs in your browser — your chat never leaves this device.</footer>
  </main>

  <script src="parser.js"></script>
  <script src="app.js"></script>
</body>
</html>
